<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XM Knowledge Club Platform</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="authPage" class="auth-page"></div>

    <div id="appShell" class="app-shell hidden">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">XM</div>
          <div>
            <strong>XM Knowledge Club</strong>
            <span>Quiz Quotient Platform</span>
          </div>
        </div>

        <nav class="nav" id="nav"></nav>

        <div class="profile-card">
          <span class="eyebrow">Signed in as</span>
          <strong id="profileName"></strong>
          <span id="profileMeta"></span>
          <button id="logoutBtn" class="quiet-button">Logout</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Academic Year 2026-27</p>
            <h1 id="viewTitle">Dashboard</h1>
          </div>
          <div class="auth-strip">
            <span id="otpStatus"></span>
          </div>
        </header>

        <section id="dashboard" class="view"></section>
        <section id="study" class="view"></section>
        <section id="results" class="view"></section>
        <section id="leaderboard" class="view"></section>
        <section id="report" class="view"></section>
        <section id="teacherReports" class="view"></section>
        <section id="builder" class="view"></section>
        <section id="admin" class="view"></section>
      </main>
    </div>

    <script src="app.js"></script>
  </body>
</html>
