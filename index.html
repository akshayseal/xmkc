<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XM Knowledge Club Platform</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-mark">XM</div>
          <div>
            <strong>XM Knowledge Club</strong>
            <span>Quiz Quotient Platform</span>
          </div>
        </div>

        <nav class="nav">
          <button class="nav-item active" data-view="dashboard">Dashboard</button>
          <button class="nav-item" data-view="quiz">Play Quiz</button>
          <button class="nav-item" data-view="leaderboard">Leaderboard</button>
          <button class="nav-item" data-view="report">Report Card</button>
          <button class="nav-item teacher-only admin-only" data-view="builder">Quiz Maker</button>
          <button class="nav-item admin-only" data-view="admin">Schools</button>
        </nav>

        <div class="profile-card">
          <span class="eyebrow">Signed in as</span>
          <strong id="profileName">Aarav Mehta</strong>
          <span id="profileMeta">Student · Class 6 · Delhi Public School</span>
          <button id="switchRoleBtn" class="ghost-button">Switch Role</button>
        </div>
      </aside>

      <main class="main">
        <header class="topbar">
          <div>
            <p class="eyebrow">Academic Year 2026-27</p>
            <h1 id="viewTitle">Dashboard</h1>
          </div>
          <div class="auth-strip">
            <span id="otpStatus">OTP verified by email</span>
            <button id="openLoginBtn" class="primary-button">Login / Signup</button>
          </div>
        </header>

        <section id="dashboard" class="view active"></section>
        <section id="quiz" class="view"></section>
        <section id="leaderboard" class="view"></section>
        <section id="report" class="view"></section>
        <section id="builder" class="view"></section>
        <section id="admin" class="view"></section>
      </main>
    </div>

    <dialog id="loginDialog" class="modal">
      <form method="dialog" class="modal-card">
        <div>
          <p class="eyebrow">Secure Access</p>
          <h2>Login or signup</h2>
          <p class="muted">Use email or phone OTP. For this prototype, any 6 digit code verifies the user.</p>
        </div>
        <label>
          Email or phone
          <input id="loginIdentity" placeholder="student@school.edu or +91..." />
        </label>
        <label>
          OTP
          <input id="otpInput" placeholder="123456" inputmode="numeric" maxlength="6" />
        </label>
        <div class="modal-actions">
          <button class="ghost-button" value="cancel">Cancel</button>
          <button id="verifyOtpBtn" class="primary-button" value="default">Verify OTP</button>
        </div>
      </form>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
